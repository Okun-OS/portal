<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okun Leads – Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-form .btn { width: 100%; justify-content: center; padding: 10px; font-size: 15px; }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; text-align: center; min-height: 20px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: #9ca3af; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
    .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; font-size: 15px; font-weight: 600; background: #fff; border: 1.5px solid #e5e7eb; border-radius: var(--radius); cursor: pointer; color: #374151; transition: all .15s; }
    .btn-google:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn-google svg { flex-shrink: 0; }
    .login-logo img { max-height: 52px; max-width: 180px; object-fit: contain; display: block; margin: 0 auto 8px; }
  </style>
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="/img/brand-logo.png" alt="Okun Leads" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'">
      <div id="logoFallback" style="display:none;flex-direction:column;align-items:center"><div class="logo-icon">&#9741;</div><h1>Okun Leads</h1></div>
      <p>Bitte melden Sie sich an</p>
    </div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label class="form-label">E-Mail-Adresse</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="ihre@email.de" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Passwort</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="error-msg" id="loginError"></div>
      <button type="submit" class="btn btn-primary" id="btnLogin">
        <span id="loginBtnText">Anmelden</span>
      </button>
    </form>

    <div id="googleSection" style="display:none">
      <div class="divider">oder</div>
      <a href="/api/auth/google" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2a10.34 10.34 0 0 0-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z" fill="#4285F4"/><path d="M9 18a8.6 8.6 0 0 0 5.96-2.18l-2.92-2.26a5.43 5.43 0 0 1-8.09-2.85H.98v2.34A9 9 0 0 0 9 18z" fill="#34A853"/><path d="M3.95 10.71a5.41 5.41 0 0 1 0-3.42V4.95H.98a9 9 0 0 0 0 8.1l2.97-2.34z" fill="#FBBC05"/><path d="M9 3.58a4.86 4.86 0 0 1 3.44 1.35l2.58-2.58A8.64 8.64 0 0 0 9 0 9 9 0 0 0 .98 4.95l2.97 2.34A5.36 5.36 0 0 1 9 3.58z" fill="#EA4335"/></svg>
        Mit Google anmelden
      </a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Redirect if already logged in
    (() => {
      const user = API.getUser();
      const token = API.getToken();
      if (token && user) {
        window.location.href = user.role === 'admin' ? '/admin/' : '/client/';
      }
      // Show error from OAuth if present
      const params = new URLSearchParams(location.search);
      const err = params.get('error');
      if (err === 'no_account') {
        document.getElementById('loginError').textContent = 'Kein Konto für ' + (params.get('email') || 'diese E-Mail') + ' gefunden.';
      } else if (err) {
        document.getElementById('loginError').textContent = 'Google-Fehler: ' + decodeURIComponent(err);
      }
    })();

    // Show Google button only if configured
    fetch('/api/auth/google-status').then(r => r.json()).then(d => {
      if (d.enabled) document.getElementById('googleSection').style.display = 'block';
    }).catch(() => {});

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');
      const btnText = document.getElementById('loginBtnText');

      errEl.textContent = '';
      btn.disabled = true;
      btnText.textContent = 'Anmelden...';

      try {
        const res = await API.post('/api/auth/login', { email, password });
        API.setAuth(res.token, res.user);
        window.location.href = res.user.role === 'admin' ? '/admin/' : '/client/';
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false;
        btnText.textContent = 'Anmelden';
      }
    });
  </script>
</body>
</html>
