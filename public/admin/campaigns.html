<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Kampagnen</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><img src="/img/brand-logo.png" alt="Okun Leads" class="brand-logo-img" onerror="this.style.display='none'"><span class="brand-logo-text">Okun Leads</span><span class="sidebar-badge admin">Admin</span></div></div>
    <nav class="sidebar-nav">
  <div class="nav-section"><span class="nav-section-label">Übersicht</span></div>
  <div class="nav-item" data-key="dashboard" onclick="location.href='/admin/'"><span class="nav-icon">&#9732;</span> Dashboard</div>
  <div class="nav-section"><span class="nav-section-label">Kunden &amp; Leads</span></div>
  <div class="nav-item" data-key="customers" onclick="location.href='/admin/customers.html'"><span class="nav-icon">&#128100;</span> Kunden</div>
  <div class="nav-item" data-key="leads" onclick="location.href='/admin/leads.html'"><span class="nav-icon">&#127919;</span> Leads</div>
  <div class="nav-section"><span class="nav-section-label">Kampagnen</span></div>
  <div class="nav-item active" data-key="campaigns" onclick="location.href='/admin/campaigns.html'"><span class="nav-icon">&#128202;</span> Kampagnen-Übersicht</div>
  <div class="nav-item" data-key="analytics" onclick="location.href='/admin/analytics.html'"><span class="nav-icon">&#128200;</span> Analytics</div>
  <div class="nav-section"><span class="nav-section-label">Assets</span></div>
  <div class="nav-item" data-key="creative-templates" onclick="location.href='/admin/creative-templates.html'"><span class="nav-icon">&#127912;</span> Kreativ-Vorlagen</div>
  <div class="nav-section"><span class="nav-section-label">Dokumente</span></div>
  <div class="nav-item" data-key="documents" onclick="location.href='/admin/documents.html'"><span class="nav-icon">&#128196;</span> Dokumente</div>
</nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebarAvatar">A</div><div><div class="user-name" id="sidebarUserName">Admin</div><div class="user-role">Administrator</div></div></div>
      <button class="btn-logout" id="btnLogout">Abmelden</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Kampagnen-Übersicht</h1>
      <button class="btn btn-primary" onclick="location.href='/admin/customers.html'">&#43; Neue Kampagne</button>
    </div>
    <div class="page-body">
      <div class="card mb-4">
        <div class="card-body" style="padding:14px 20px">
          <div class="search-bar">
            <select id="filterCustomer" class="form-control" style="width:200px">
              <option value="">Alle Kunden</option>
            </select>
            <button class="btn btn-secondary" onclick="loadCampaigns()">Filtern</button>
          </div>
        </div>
      </div>

      <div id="campaignsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px">
        <div class="loading-overlay">Laden...</div>
      </div>
    </div>
  </main>
</div>


<div id="toast" style="display:none;position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:9999;"></div>
<style>.toast-success{background:#16a34a}.toast-error{background:#dc2626}</style>

<script src="/js/api.js"></script>
<script>
  requireAuth('admin');
  initNav('campaigns');

  let customers = [];

  async function init() {
    customers = await API.get('/api/admin/customers');
    customers.forEach(c => {
      ['cCustomer','filterCustomer'].forEach(id => {
        const opt = document.createElement('option');
        opt.value = c.id; opt.textContent = c.company_name;
        document.getElementById(id).appendChild(opt);
      });
    });
    loadCampaigns();
  }

  async function loadCampaigns() {
    const cid = document.getElementById('filterCustomer').value;
    let url = '/api/admin/campaigns';
    if (cid) url += '?customer_id=' + cid;
    try {
      const campaigns = await API.get(url);
      renderCampaigns(campaigns);
    } catch(e) { showToast(e.message,'error'); }
  }

  function renderCampaigns(campaigns) {
    if (!campaigns.length) {
      document.getElementById('campaignsGrid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">&#128202;</div><h3>Keine Kampagnen</h3><p>Erstellen Sie Ihre erste Kampagne.</p></div>`;
      return;
    }

    document.getElementById('campaignsGrid').innerHTML = campaigns.map(c => {
      const cpl = c.lead_count > 0 ? (c.budget_monthly / c.lead_count).toFixed(2) : null;
      return `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">${c.name}</div>
              <div class="text-sm text-muted">${c.company_name}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              ${statusBadge(c.status)}
              <button class="btn btn-sm btn-danger" onclick="deleteCampaign(${c.id},'${c.name}')">&#215;</button>
            </div>
          </div>
          <div class="card-body">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
              <div><div class="stat-label">Leads gesamt</div><div style="font-size:22px;font-weight:700">${c.lead_count}</div></div>
              <div><div class="stat-label">Abgeschlossen</div><div style="font-size:22px;font-weight:700;color:var(--success)">${c.closed_leads}</div></div>
              <div><div class="stat-label">Monatsbudget</div><div style="font-size:16px;font-weight:600">${formatCurrency(c.budget_monthly)}</div></div>
              <div><div class="stat-label">Kosten / Lead</div><div style="font-size:16px;font-weight:600">${cpl ? formatCurrency(cpl) : '—'}</div></div>
            </div>
            ${c.platform ? `<div class="text-sm text-muted">Plattform: ${c.platform}</div>` : ''}
            ${c.start_date ? `<div class="text-sm text-muted">Start: ${formatDate(c.start_date)}</div>` : ''}
            ${c.description ? `<div class="text-sm" style="margin-top:8px;color:var(--gray-600)">${c.description}</div>` : ''}
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid #f3f4f6">
              <button class="btn btn-primary btn-sm" style="width:100%" onclick="location.href='/admin/campaign-wizard.html?campaign_id=${c.id}&customer_id=${c.customer_id}'">🧙 Wizard öffnen</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }


  async function deleteCampaign(id, name) {
    if (!confirm(`Kampagne "${name}" löschen?`)) return;
    try {
      await API.del('/api/admin/campaigns/' + id);
      showToast('Kampagne gelöscht');
      loadCampaigns();
    } catch(e) { showToast(e.message,'error'); }
  }

  init();
</script>
</body>
</html>
