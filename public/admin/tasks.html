<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Optimierungs-Tasks</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-dot">&#9741;</div>Lead Portal<span class="sidebar-badge admin">Admin</span></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section"><span class="nav-section-label">Übersicht</span></div>
      <div class="nav-item" data-key="dashboard" onclick="location.href='/admin/'"><span class="nav-icon">&#9732;</span> Dashboard</div>
      <div class="nav-section"><span class="nav-section-label">Kunden & Leads</span></div>
      <div class="nav-item" data-key="customers" onclick="location.href='/admin/customers.html'"><span class="nav-icon">&#128100;</span> Kunden</div>
      <div class="nav-item" data-key="leads" onclick="location.href='/admin/leads.html'"><span class="nav-icon">&#127919;</span> Leads</div>
      <div class="nav-section"><span class="nav-section-label">Kampagnen</span></div>
      <div class="nav-item" data-key="campaigns" onclick="location.href='/admin/campaigns.html'"><span class="nav-icon">&#128202;</span> Kampagnen</div>
      <div class="nav-item" data-key="analytics" onclick="location.href='/admin/analytics.html'"><span class="nav-icon">&#128200;</span> Analytics</div>
      <div class="nav-section"><span class="nav-section-label">KI-Tools</span></div>
      <div class="nav-item" data-key="ai" onclick="location.href='/admin/ai-tools.html'"><span class="nav-icon">&#129504;</span> Analyse & Studio</div>
      <div class="nav-item active" data-key="tasks" onclick="location.href='/admin/tasks.html'"><span class="nav-icon">&#9989;</span> Optimierungs-Tasks</div>
      <div class="nav-section"><span class="nav-section-label">Dokumente</span></div>
      <div class="nav-item" data-key="documents" onclick="location.href='/admin/documents.html'"><span class="nav-icon">&#128196;</span> Dokumente</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebarAvatar">A</div><div><div class="user-name" id="sidebarUserName">Admin</div><div class="user-role">Administrator</div></div></div>
      <button class="btn-logout" id="btnLogout">Abmelden</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Optimierungs-Tasks</h1>
      <button class="btn btn-primary" onclick="openNewTask()">&#43; Neuer Task</button>
    </div>
    <div class="page-body">

      <!-- Filter -->
      <div class="card mb-4">
        <div class="card-body" style="padding:14px 20px">
          <div class="search-bar">
            <select id="filterCustomer" class="form-control" style="width:200px" onchange="loadTasks()">
              <option value="">Alle Kunden</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Stats chips -->
      <div style="display:flex;gap:12px;margin-bottom:20px" id="taskStats"></div>

      <!-- Board -->
      <div class="task-board" id="taskBoard">
        <div class="loading-overlay" style="grid-column:1/-1">Laden...</div>
      </div>
    </div>
  </main>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="modalTask">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="taskModalTitle">Neuer Task</span>
      <button class="modal-close" onclick="closeModal('modalTask')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="taskId">
      <div class="form-group">
        <label class="form-label">Titel <span class="required">*</span></label>
        <input type="text" id="tTitle" class="form-control" placeholder="z.B. Neue Headline testen">
      </div>
      <div class="form-group">
        <label class="form-label">Beschreibung</label>
        <textarea id="tDesc" class="form-control" rows="4" placeholder="Was genau soll gemacht werden?"></textarea>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Priorität</label>
          <select id="tPriority" class="form-control">
            <option value="high">Hoch</option>
            <option value="medium" selected>Mittel</option>
            <option value="low">Niedrig</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="tStatus" class="form-control">
            <option value="open">Offen</option>
            <option value="in_progress">In Arbeit</option>
            <option value="done">Erledigt</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Kunde</label>
          <select id="tCustomer" class="form-control"><option value="">-- Kein --</option></select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btnDeleteTask" style="display:none;margin-right:auto" onclick="deleteCurrentTask()">&#215; Löschen</button>
      <button class="btn btn-secondary" onclick="closeModal('modalTask')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveTask()">Speichern</button>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:9999;"></div>

<script src="/js/api.js"></script>
<script>
  requireAuth('admin');
  initNav('tasks');

  let allTasks = [];

  const columns = [
    { key: 'open',        label: 'Offen',     color: 'var(--gray-500)' },
    { key: 'in_progress', label: 'In Arbeit', color: 'var(--warning)' },
    { key: 'done',        label: 'Erledigt',  color: 'var(--success)' },
  ];

  const priorityLabels = { high: 'Hoch', medium: 'Mittel', low: 'Niedrig' };
  const sourceLabels = { ai: 'KI', manual: 'Manuell' };

  async function init() {
    const customers = await API.get('/api/admin/customers');
    ['filterCustomer', 'tCustomer'].forEach(id => {
      customers.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = c.company_name;
        document.getElementById(id).appendChild(o);
      });
    });
    loadTasks();
  }

  async function loadTasks() {
    const cid = document.getElementById('filterCustomer').value;
    let url = '/api/admin/tasks';
    if (cid) url += '?customer_id=' + cid;
    try {
      allTasks = await API.get(url);
      renderBoard();
    } catch(e) { showToast(e.message,'error'); }
  }

  function renderBoard() {
    const open = allTasks.filter(t => t.status === 'open');
    const inProg = allTasks.filter(t => t.status === 'in_progress');
    const done = allTasks.filter(t => t.status === 'done');

    // Stats
    document.getElementById('taskStats').innerHTML = `
      <div style="background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:8px 16px;font-size:13px">
        <strong>${allTasks.length}</strong> Total
      </div>
      <div style="background:#fef3c7;border:1px solid #fde68a;border-radius:var(--radius);padding:8px 16px;font-size:13px;color:#92400e">
        <strong>${open.length}</strong> Offen
      </div>
      <div style="background:#dbeafe;border:1px solid #bfdbfe;border-radius:var(--radius);padding:8px 16px;font-size:13px;color:#1d4ed8">
        <strong>${inProg.length}</strong> In Arbeit
      </div>
      <div style="background:#dcfce7;border:1px solid #bbf7d0;border-radius:var(--radius);padding:8px 16px;font-size:13px;color:#15803d">
        <strong>${done.length}</strong> Erledigt
      </div>
      ${allTasks.filter(t => t.priority === 'high' && t.status !== 'done').length ? `
        <div style="background:#fee2e2;border:1px solid #fecaca;border-radius:var(--radius);padding:8px 16px;font-size:13px;color:#b91c1c">
          &#9888; <strong>${allTasks.filter(t => t.priority === 'high' && t.status !== 'done').length}</strong> Hohe Priorität
        </div>
      ` : ''}
    `;

    document.getElementById('taskBoard').innerHTML = columns.map(col => {
      const tasks = allTasks.filter(t => t.status === col.key);
      return `
        <div class="task-column">
          <div class="task-column-header">
            <span class="task-column-title" style="color:${col.color}">${col.label}</span>
            <span class="task-count">${tasks.length}</span>
          </div>
          ${tasks.length === 0
            ? `<div style="text-align:center;padding:20px;color:var(--gray-400);font-size:12px">Keine Tasks</div>`
            : tasks.map(t => renderTaskCard(t)).join('')
          }
        </div>
      `;
    }).join('');
  }

  function renderTaskCard(t) {
    return `
      <div class="task-card" onclick="editTask(${t.id})">
        <div class="task-title">${t.title}</div>
        ${t.description ? `<div class="task-desc">${t.description.slice(0, 100)}${t.description.length > 100 ? '...' : ''}</div>` : ''}
        <div class="task-meta">
          <div class="priority-dot priority-${t.priority}"></div>
          <span class="text-sm text-muted">${priorityLabels[t.priority]}</span>
          ${t.source === 'ai' ? `<span class="badge badge-ai" style="font-size:10px;margin-left:auto">KI</span>` : ''}
          ${t.company_name ? `<span class="text-sm text-muted" style="margin-left:auto">${t.company_name}</span>` : ''}
        </div>
      </div>
    `;
  }

  function openNewTask() {
    document.getElementById('taskModalTitle').textContent = 'Neuer Task';
    document.getElementById('taskId').value = '';
    document.getElementById('tTitle').value = '';
    document.getElementById('tDesc').value = '';
    document.getElementById('tPriority').value = 'medium';
    document.getElementById('tStatus').value = 'open';
    document.getElementById('tCustomer').value = '';
    document.getElementById('btnDeleteTask').style.display = 'none';
    openModal('modalTask');
  }

  async function editTask(id) {
    const task = allTasks.find(t => t.id === id);
    if (!task) return;
    document.getElementById('taskModalTitle').textContent = 'Task bearbeiten';
    document.getElementById('taskId').value = task.id;
    document.getElementById('tTitle').value = task.title;
    document.getElementById('tDesc').value = task.description || '';
    document.getElementById('tPriority').value = task.priority;
    document.getElementById('tStatus').value = task.status;
    document.getElementById('tCustomer').value = task.customer_id || '';
    document.getElementById('btnDeleteTask').style.display = '';
    openModal('modalTask');
  }

  async function saveTask() {
    const id = document.getElementById('taskId').value;
    const body = {
      title: document.getElementById('tTitle').value,
      description: document.getElementById('tDesc').value,
      priority: document.getElementById('tPriority').value,
      status: document.getElementById('tStatus').value,
      customer_id: document.getElementById('tCustomer').value || null,
    };
    if (!body.title) { showToast('Titel erforderlich','error'); return; }
    try {
      if (id) await API.put('/api/admin/tasks/' + id, body);
      else await API.post('/api/admin/tasks', body);
      closeModal('modalTask');
      showToast(id ? 'Task aktualisiert' : 'Task erstellt');
      loadTasks();
    } catch(e) { showToast(e.message,'error'); }
  }

  async function deleteCurrentTask() {
    const id = document.getElementById('taskId').value;
    if (!id || !confirm('Task löschen?')) return;
    try {
      await API.del('/api/admin/tasks/' + id);
      closeModal('modalTask');
      showToast('Task gelöscht');
      loadTasks();
    } catch(e) { showToast(e.message,'error'); }
  }

  init();
</script>
</body>
</html>
