<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Dokumente</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-dot">&#9741;</div>Lead Portal<span class="sidebar-badge admin">Admin</span></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section"><span class="nav-section-label">Übersicht</span></div>
      <div class="nav-item" data-key="dashboard" onclick="location.href='/admin/'"><span class="nav-icon">&#9732;</span> Dashboard</div>
      <div class="nav-section"><span class="nav-section-label">Kunden &amp; Leads</span></div>
      <div class="nav-item" data-key="customers" onclick="location.href='/admin/customers.html'"><span class="nav-icon">&#128100;</span> Kunden</div>
      <div class="nav-item" data-key="leads" onclick="location.href='/admin/leads.html'"><span class="nav-icon">&#127919;</span> Leads</div>
      <div class="nav-section"><span class="nav-section-label">Kampagnen</span></div>
      <div class="nav-item" data-key="campaigns" onclick="location.href='/admin/campaigns.html'"><span class="nav-icon">&#128202;</span> Kampagnen</div>
      <div class="nav-item" data-key="analytics" onclick="location.href='/admin/analytics.html'"><span class="nav-icon">&#128200;</span> Analytics</div>
<div class="nav-section"><span class="nav-section-label">Funnel</span></div>
      <div class="nav-item" data-key="funnels" onclick="location.href='/admin/funnels.html'"><span class="nav-icon">&
<div class="nav-section"><span class="nav-section-label">KI-Tools</span></div>
      <div class="nav-item" data-key="ai" onclick="location.href='/admin/ai-tools.html'"><span class="nav-icon">&#129504;</span> Analyse &amp; Studio</div>
      <div class="nav-item" data-key="tasks" onclick="location.href='/admin/tasks.html'"><span class="nav-icon">&#9989;</span> Optimierungs-Tasks</div>
      <div class="nav-section"><span class="nav-section-label">Dokumente</span></div>
      <div class="nav-item active" data-key="documents" onclick="location.href='/admin/documents.html'"><span class="nav-icon">&#128196;</span> Dokumente</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebarAvatar">A</div><div><div class="user-name" id="sidebarUserName">Admin</div><div class="user-role">Administrator</div></div></div>
      <button class="btn-logout" id="btnLogout">Abmelden</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Dokumente</h1>
      <div class="flex gap-2">
        <button class="btn btn-secondary" onclick="openModal('modalUpload')">&#128196; Hochladen</button>
        <button class="btn btn-primary" onclick="openModal('modalInvoice')">&#43; Rechnung erstellen</button>
      </div>
    </div>
    <div class="page-body">
      <div class="card mb-4">
        <div class="card-body" style="padding:14px 20px">
          <div class="search-bar">
            <select id="filterCustomer" class="form-control" style="width:200px"><option value="">Alle Kunden</option></select>
            <select id="filterType" class="form-control" style="width:160px">
              <option value="">Alle Typen</option>
              <option value="invoice">Rechnungen</option>
              <option value="offer">Angebote</option>
            </select>
            <button class="btn btn-secondary" onclick="loadDocuments()">Filtern</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="table-wrapper" id="docsTableWrap"><div class="loading-overlay">Laden...</div></div>
      </div>
    </div>
  </main>
</div>

<!-- Upload Modal -->
<div class="modal-overlay" id="modalUpload">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Dokument hochladen</span>
      <button class="modal-close" onclick="closeModal('modalUpload')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Kunde <span class="required">*</span></label>
        <select id="upCustomer" class="form-control"><option value="">-- Auswählen --</option></select>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Typ <span class="required">*</span></label>
          <select id="upType" class="form-control">
            <option value="offer">Angebot</option>
            <option value="invoice">Rechnung</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="upStatus" class="form-control">
            <option value="draft">Entwurf</option>
            <option value="sent">Gesendet</option>
            <option value="paid">Bezahlt</option>
          </select>
        </div>
        <div class="form-group col-span-2">
          <label class="form-label">Titel <span class="required">*</span></label>
          <input type="text" id="upTitle" class="form-control" placeholder="Angebot Q1 2024">
        </div>
        <div class="form-group">
          <label class="form-label">Betrag (€)</label>
          <input type="number" id="upAmount" class="form-control" placeholder="0.00" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">Fällig am</label>
          <input type="date" id="upDue" class="form-control">
        </div>
        <div class="form-group col-span-2">
          <label class="form-label">Datei (PDF) <span class="required">*</span></label>
          <input type="file" id="upFile" class="form-control" accept=".pdf,.doc,.docx,.png,.jpg">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalUpload')">Abbrechen</button>
      <button class="btn btn-primary" onclick="uploadDocument()">Hochladen</button>
    </div>
  </div>
</div>

<!-- Invoice Generator Modal -->
<div class="modal-overlay" id="modalInvoice">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title">Rechnung erstellen</span>
      <button class="modal-close" onclick="closeModal('modalInvoice')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Kunde <span class="required">*</span></label>
          <select id="invCustomer" class="form-control"><option value="">-- Auswählen --</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">Rechnungsnummer</label>
          <input type="text" id="invNumber" class="form-control" placeholder="R-2024-001">
        </div>
        <div class="form-group col-span-2">
          <label class="form-label">Titel <span class="required">*</span></label>
          <input type="text" id="invTitle" class="form-control" placeholder="Rechnung Lead-Marketing Januar 2024">
        </div>
        <div class="form-group">
          <label class="form-label">Fällig am</label>
          <input type="date" id="invDue" class="form-control">
        </div>
      </div>

      <div style="margin:16px 0">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <strong>Positionen</strong>
          <button class="btn btn-sm btn-secondary" onclick="addItem()">&#43; Position</button>
        </div>
        <div id="invoiceItems">
          <div class="form-grid" id="item0" style="margin-bottom:8px">
            <div class="form-group"><label class="form-label">Beschreibung</label><input type="text" class="form-control item-desc" placeholder="Lead-Generierung Januar"></div>
            <div class="form-group"><label class="form-label">Menge</label><input type="number" class="form-control item-qty" value="1" min="1"></div>
            <div class="form-group"><label class="form-label">Einzelpreis (€, netto)</label><input type="number" class="form-control item-price" placeholder="0.00" step="0.01"></div>
            <div class="form-group" style="display:flex;align-items:flex-end"><button class="btn btn-sm btn-danger" onclick="removeItem(0)">&#215;</button></div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Anmerkungen</label>
        <textarea id="invNotes" class="form-control" rows="2" placeholder="Zahlbar innerhalb von 14 Tagen..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalInvoice')">Abbrechen</button>
      <button class="btn btn-primary" onclick="generateInvoice()">PDF erstellen & speichern</button>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:9999;"></div>
<style>.toast-success{background:#16a34a}.toast-error{background:#dc2626}</style>

<script src="/js/api.js"></script>
<script>
  requireAuth('admin');
  initNav('documents');

  let customers = [];
  let itemCount = 1;

  async function init() {
    customers = await API.get('/api/admin/customers');
    ['upCustomer','invCustomer','filterCustomer'].forEach(id => {
      customers.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id; opt.textContent = c.company_name;
        document.getElementById(id).appendChild(opt);
      });
    });
    loadDocuments();
  }

  async function loadDocuments() {
    const cid = document.getElementById('filterCustomer').value;
    const type = document.getElementById('filterType').value;
    let url = '/api/admin/documents';
    const params = [];
    if (cid) params.push('customer_id=' + cid);
    if (type) params.push('type=' + type);
    if (params.length) url += '?' + params.join('&');

    try {
      const docs = await API.get(url);
      renderDocs(docs);
    } catch(e) { showToast(e.message,'error'); }
  }

  function renderDocs(docs) {
    if (!docs.length) {
      document.getElementById('docsTableWrap').innerHTML = `<div class="empty-state"><div class="empty-state-icon">&#128196;</div><h3>Keine Dokumente</h3></div>`;
      return;
    }
    const rows = docs.map(d => `
      <tr>
        <td>${statusBadge(d.type)}</td>
        <td><strong>${d.title}</strong></td>
        <td>${d.company_name}</td>
        <td>${d.amount != null ? formatCurrency(d.amount) : '—'}</td>
        <td>${statusBadge(d.status)}</td>
        <td class="text-sm text-muted">${d.due_date ? formatDate(d.due_date) : '—'}</td>
        <td class="text-sm text-muted">${formatDate(d.created_at)}</td>
        <td>
          <div class="table-actions">
            <a href="${d.filepath}" target="_blank" class="btn btn-sm btn-secondary">&#128065; Ansehen</a>
            <select class="form-control" style="width:110px;padding:4px 8px;font-size:12px" onchange="updateDocStatus(${d.id},this.value)">
              <option value="draft" ${d.status==='draft'?'selected':''}>Entwurf</option>
              <option value="sent" ${d.status==='sent'?'selected':''}>Gesendet</option>
              <option value="paid" ${d.status==='paid'?'selected':''}>Bezahlt</option>
            </select>
            <button class="btn btn-sm btn-danger" onclick="deleteDoc(${d.id})">&#215;</button>
          </div>
        </td>
      </tr>
    `).join('');
    document.getElementById('docsTableWrap').innerHTML = `
      <table>
        <thead><tr><th>Typ</th><th>Titel</th><th>Kunde</th><th>Betrag</th><th>Status</th><th>Fällig</th><th>Erstellt</th><th>Aktionen</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  async function uploadDocument() {
    const fd = new FormData();
    fd.append('customer_id', document.getElementById('upCustomer').value);
    fd.append('type', document.getElementById('upType').value);
    fd.append('title', document.getElementById('upTitle').value);
    fd.append('status', document.getElementById('upStatus').value);
    fd.append('amount', document.getElementById('upAmount').value);
    fd.append('due_date', document.getElementById('upDue').value);
    fd.append('file', document.getElementById('upFile').files[0]);

    try {
      await API.upload('/api/admin/documents/upload', fd);
      closeModal('modalUpload');
      showToast('Dokument hochgeladen');
      loadDocuments();
    } catch(e) { showToast(e.message,'error'); }
  }

  function addItem() {
    const id = itemCount++;
    const div = document.createElement('div');
    div.className = 'form-grid';
    div.id = 'item' + id;
    div.style.marginBottom = '8px';
    div.innerHTML = `
      <div class="form-group"><label class="form-label">Beschreibung</label><input type="text" class="form-control item-desc" placeholder="Leistung"></div>
      <div class="form-group"><label class="form-label">Menge</label><input type="number" class="form-control item-qty" value="1" min="1"></div>
      <div class="form-group"><label class="form-label">Einzelpreis (€)</label><input type="number" class="form-control item-price" placeholder="0.00" step="0.01"></div>
      <div class="form-group" style="display:flex;align-items:flex-end"><button class="btn btn-sm btn-danger" onclick="removeItem(${id})">&#215;</button></div>
    `;
    document.getElementById('invoiceItems').appendChild(div);
  }

  function removeItem(id) {
    document.getElementById('item' + id)?.remove();
  }

  async function generateInvoice() {
    const items = [];
    document.querySelectorAll('#invoiceItems > div').forEach(row => {
      items.push({
        description: row.querySelector('.item-desc')?.value,
        quantity: parseFloat(row.querySelector('.item-qty')?.value) || 1,
        unit_price: parseFloat(row.querySelector('.item-price')?.value) || 0,
      });
    });

    const body = {
      customer_id: document.getElementById('invCustomer').value,
      title: document.getElementById('invTitle').value,
      invoice_number: document.getElementById('invNumber').value,
      due_date: document.getElementById('invDue').value || null,
      notes: document.getElementById('invNotes').value,
      items,
    };

    try {
      const res = await API.post('/api/admin/documents/generate-invoice', body);
      closeModal('modalInvoice');
      showToast('Rechnung erstellt: ' + formatCurrency(res.amount));
      loadDocuments();
    } catch(e) { showToast(e.message,'error'); }
  }

  async function updateDocStatus(id, status) {
    try {
      await API.put('/api/admin/documents/' + id, { status });
      showToast('Status aktualisiert');
    } catch(e) { showToast(e.message,'error'); }
  }

  async function deleteDoc(id) {
    if (!confirm('Dokument löschen?')) return;
    try {
      await API.del('/api/admin/documents/' + id);
      showToast('Dokument gelöscht');
      loadDocuments();
    } catch(e) { showToast(e.message,'error'); }
  }

  init();
</script>
</body>
</html>
