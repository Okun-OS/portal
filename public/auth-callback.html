<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Anmeldung...</title>
<style>body{font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f5f5f5}</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const dest = params.get('dest') || '/';
  if (token) {
    localStorage.setItem('token', token);
    location.replace(dest);
  } else {
    location.replace('/?error=no_token');
  }
</script>
</body></html>
