<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Portal – Dokumente</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-dot">&#9741;</div>Mein Portal<span class="sidebar-badge client">Kunde</span></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section"><span class="nav-section-label">Übersicht</span></div>
      <div class="nav-item" data-key="dashboard" onclick="location.href='/client/'"><span class="nav-icon">&#9732;</span> Dashboard</div>
      <div class="nav-section"><span class="nav-section-label">Meine Anfragen</span></div>
      <div class="nav-item" data-key="leads" onclick="location.href='/client/leads.html'"><span class="nav-icon">&#127919;</span> Meine Leads</div>
      <div class="nav-item" data-key="campaigns" onclick="location.href='/client/campaigns.html'"><span class="nav-icon">&#128202;</span> Meine Kampagne</div>
      <div class="nav-section"><span class="nav-section-label">Finanzen</span></div>
      <div class="nav-item active" data-key="documents" onclick="location.href='/client/documents.html'"><span class="nav-icon">&#128196;</span> Rechnungen &amp; Angebote</div>
      <div class="nav-section"><span class="nav-section-label">Konto</span></div>
      <div class="nav-item" data-key="settings" onclick="location.href='/client/settings.html'"><span class="nav-icon">&#9881;</span> Einstellungen</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebarAvatar">K</div><div><div class="user-name" id="sidebarUserName">Kunde</div><div class="user-role">Kundenportal</div></div></div>
      <button class="btn-logout" id="btnLogout">Abmelden</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Dokumente</h1>
    </div>
    <div class="page-body">
      <div class="tabs">
        <div class="tab active" onclick="filterDocs('')">Alle</div>
        <div class="tab" onclick="filterDocs('offer')">Angebote</div>
        <div class="tab" onclick="filterDocs('invoice')">Rechnungen</div>
      </div>

      <div class="card">
        <div class="table-wrapper" id="docsTableWrap"><div class="loading-overlay">Laden...</div></div>
      </div>
    </div>
  </main>
</div>

<div id="toast" style="display:none;position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:9999;"></div>
<style>.toast-success{background:#16a34a}.toast-error{background:#dc2626}</style>

<script src="/js/api.js"></script>
<script>
  requireAuth('client');
  initNav('documents');

  let allDocs = [];

  async function loadDocuments() {
    try {
      allDocs = await API.get('/api/client/documents');
      renderDocs(allDocs);
    } catch(e) { showToast(e.message,'error'); }
  }

  function filterDocs(type) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', ['','offer','invoice'][i] === type);
    });
    const filtered = type ? allDocs.filter(d => d.type === type) : allDocs;
    renderDocs(filtered);
  }

  function renderDocs(docs) {
    if (!docs.length) {
      document.getElementById('docsTableWrap').innerHTML = `<div class="empty-state"><div class="empty-state-icon">&#128196;</div><h3>Keine Dokumente</h3><p>Es sind noch keine Dokumente für Ihr Konto hinterlegt.</p></div>`;
      return;
    }

    const rows = docs.map(d => `
      <tr>
        <td>${statusBadge(d.type)}</td>
        <td><strong>${d.title}</strong></td>
        <td>${d.amount != null ? formatCurrency(d.amount) : '—'}</td>
        <td>${statusBadge(d.status)}</td>
        <td class="text-muted text-sm">${d.due_date ? formatDate(d.due_date) : '—'}</td>
        <td class="text-muted text-sm">${formatDate(d.created_at)}</td>
        <td>
          <a href="${d.filepath}" target="_blank" download class="btn btn-sm btn-primary">&#11123; Herunterladen</a>
        </td>
      </tr>
    `).join('');

    document.getElementById('docsTableWrap').innerHTML = `
      <table>
        <thead><tr><th>Typ</th><th>Titel</th><th>Betrag</th><th>Status</th><th>Fällig am</th><th>Datum</th><th>Aktion</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  loadDocuments();
</script>
</body>
</html>
