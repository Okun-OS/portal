<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Portal – Meine Kampagne</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><div class="logo-dot">&#9741;</div>Mein Portal<span class="sidebar-badge client">Kunde</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section"><span class="nav-section-label">Übersicht</span></div>
      <div class="nav-item" data-key="dashboard" onclick="location.href='/client/'"><span class="nav-icon">&#9732;</span> Dashboard</div>
      <div class="nav-section"><span class="nav-section-label">Meine Anfragen</span></div>
      <div class="nav-item" data-key="leads" onclick="location.href='/client/leads.html'"><span class="nav-icon">&#127919;</span> Meine Leads</div>
      <div class="nav-item active" data-key="campaigns" onclick="location.href='/client/campaigns.html'"><span class="nav-icon">&#128202;</span> Meine Kampagne</div>
      <div class="nav-section"><span class="nav-section-label">Finanzen</span></div>
      <div class="nav-item" data-key="documents" onclick="location.href='/client/documents.html'"><span class="nav-icon">&#128196;</span> Rechnungen &amp; Angebote</div>
      <div class="nav-section"><span class="nav-section-label">Konto</span></div>
      <div class="nav-item" data-key="settings" onclick="location.href='/client/settings.html'"><span class="nav-icon">&#9881;</span> Einstellungen</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebarAvatar">K</div><div><div class="user-name" id="sidebarUserName">Kunde</div><div class="user-role">Kundenportal</div></div></div>
      <button class="btn-logout" id="btnLogout">Abmelden</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Meine Kampagne</h1>
    </div>
    <div class="page-body" id="campaignContent">
      <div class="loading-overlay">Laden...</div>
    </div>
  </main>
</div>

<div id="toast" style="display:none;position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:9999;"></div>

<script src="/js/api.js"></script>
<script>
  requireAuth('client');
  initNav('campaigns');

  // Friendly status messages – no marketing jargon
  const statusMessages = {
    active: {
      title: 'Ihre Werbung läuft aktiv',
      message: 'Wir schalten aktuell Werbung für Ihr Unternehmen und generieren neue Anfragen. Alles läuft nach Plan.',
      icon: '&#128994;',
      cls: 'active',
      detail: 'Sobald eine neue Anfrage eingeht, wird diese automatisch in Ihrer Lead-Liste eingetragen.'
    },
    paused: {
      title: 'Kampagne ist pausiert',
      message: 'Ihre Werbung ist momentan ausgesetzt. Mögliche Gründe: Budgetanpassung, saisonale Pause oder Optimierung.',
      icon: '&#128993;',
      cls: 'paused',
      detail: 'Bei Fragen wenden Sie sich gerne an uns. Wir schalten die Kampagne schnell wieder aktiv.'
    },
    ended: {
      title: 'Diese Kampagne wurde abgeschlossen',
      message: 'Die Kampagne ist beendet. Die generierten Leads sind weiterhin in Ihrer Liste sichtbar.',
      icon: '&#9898;',
      cls: 'paused',
      detail: 'Sprechen Sie uns an, wenn Sie eine neue Kampagne starten möchten.'
    }
  };

  async function loadCampaigns() {
    try {
      const campaigns = await API.get('/api/client/campaigns');
      const container = document.getElementById('campaignContent');

      if (!campaigns.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#128202;</div>
            <h3>Noch keine Kampagne</h3>
            <p>Es wurde noch keine Kampagne für Ihr Konto eingerichtet.<br>Bitte sprechen Sie uns an.</p>
          </div>`;
        return;
      }

      container.innerHTML = campaigns.map(c => {
        const info = statusMessages[c.status] || statusMessages.active;
        const successRate = c.lead_count > 0 ? Math.round((c.closed_leads / c.lead_count) * 100) : 0;

        return `
          <div style="max-width:680px;margin-bottom:24px">

            <!-- Status card -->
            <div class="campaign-status-card ${info.cls}" style="margin-bottom:20px">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                <span style="font-size:24px">${info.icon}</span>
                <div>
                  <div class="cs-title">${info.title}</div>
                  <div style="font-size:12px;font-weight:500;color:var(--gray-500);margin-top:2px">${c.name}</div>
                </div>
              </div>
              <div class="cs-message">${info.message}</div>
              <div style="font-size:13px;color:var(--gray-500);margin-top:8px">${info.detail}</div>
            </div>

            <!-- Simple stats – no CTR/CPC/CPL -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">
              <div class="card" style="padding:20px">
                <div style="font-size:12px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Anfragen gesamt</div>
                <div style="font-size:36px;font-weight:800;color:var(--gray-900)">${c.lead_count}</div>
                <div style="font-size:12px;color:var(--gray-400);margin-top:4px">Alle Anfragen seit Start</div>
              </div>
              <div class="card" style="padding:20px">
                <div style="font-size:12px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Erfolgreich abgeschlossen</div>
                <div style="font-size:36px;font-weight:800;color:var(--success)">${c.closed_leads}</div>
                <div style="font-size:12px;color:var(--gray-400);margin-top:4px">Von Ihnen als abgeschlossen markiert</div>
              </div>
            </div>

            ${c.lead_count > 0 ? `
              <!-- Progress without jargon -->
              <div class="card" style="padding:20px;margin-bottom:20px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                  <span style="font-size:13px;font-weight:600;color:var(--gray-700)">Ihre Abschluss-Quote</span>
                  <span style="font-size:18px;font-weight:700;color:var(--success)">${successRate}%</span>
                </div>
                <div style="height:10px;background:var(--gray-100);border-radius:5px;overflow:hidden">
                  <div style="height:100%;background:var(--success);border-radius:5px;width:${successRate}%;transition:width 0.5s"></div>
                </div>
                <div style="font-size:12px;color:var(--gray-400);margin-top:6px">
                  ${c.closed_leads} von ${c.lead_count} Anfragen erfolgreich abgeschlossen
                </div>
              </div>
            ` : ''}

            <!-- Dates info if available -->
            ${c.start_date ? `
              <div class="card" style="padding:16px">
                <div style="display:flex;gap:24px;font-size:13px">
                  <div><span style="color:var(--gray-500)">Kampagnenstart: </span><strong>${formatDate(c.start_date)}</strong></div>
                  ${c.end_date ? `<div><span style="color:var(--gray-500)">Geplantes Ende: </span><strong>${formatDate(c.end_date)}</strong></div>` : ''}
                  ${c.platform ? `<div><span style="color:var(--gray-500)">Plattform: </span><strong>${c.platform}</strong></div>` : ''}
                </div>
              </div>
            ` : ''}

          </div>
        `;
      }).join('');

    } catch(e) { showToast(e.message, 'error'); }
  }

  loadCampaigns();
</script>
</body>
</html>
