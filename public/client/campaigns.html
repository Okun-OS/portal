<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Portal – Meine Kampagne</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .camp-hero { background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%); color: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .camp-hero-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .camp-hero-sub { font-size: 13px; opacity: 0.85; }
    .camp-status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
    .pill-active { background: rgba(255,255,255,0.25); color: #fff; }
    .pill-paused { background: rgba(0,0,0,0.1); color: rgba(255,255,255,0.8); }
    .camp-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .camp-detail-item { background: #f9fafb; border-radius: 8px; padding: 14px 16px; }
    .camp-detail-label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .camp-detail-value { font-size: 22px; font-weight: 800; color: #111827; }
    .camp-detail-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .landing-page-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1.5px solid #e5e7eb; border-radius: 10px; margin-bottom: 10px; transition: border-color .2s; }
    .landing-page-card:hover { border-color: var(--primary); }
    .lp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .lp-dot-live { background: #16a34a; }
    .lp-dot-draft { background: #9ca3af; }
    .info-row { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: #4b5563; margin-bottom: 12px; }
    .info-row span { display: flex; align-items: center; gap: 5px; }
    .progress-bar-wrap { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin: 6px 0; }
    .progress-bar-fill { height: 100%; border-radius: 4px; background: var(--success); transition: width .5s; }
    .camp-section-title { font-size: 13px; font-weight: 700; color: #374151; margin: 20px 0 10px; }
    .no-camp-state { text-align: center; padding: 60px 24px; }
    .no-camp-icon { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><img src="/img/brand-logo.png" alt="Okun Leads" class="brand-logo-img" onerror="this.style.display='none'"><span class="brand-logo-text">Okun Leads</span><span class="sidebar-badge client">Kunde</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section"><span class="nav-section-label">Übersicht</span></div>
      <div class="nav-item" data-key="dashboard" onclick="location.href='/client/'"><span class="nav-icon">&#9732;</span> Dashboard</div>
      <div class="nav-section"><span class="nav-section-label">Meine Anfragen</span></div>
      <div class="nav-item" data-key="leads" onclick="location.href='/client/leads.html'"><span class="nav-icon">&#127919;</span> Meine Leads</div>
      <div class="nav-item active" data-key="campaigns" onclick="location.href='/client/campaigns.html'"><span class="nav-icon">&#128202;</span> Meine Kampagne</div>
      <div class="nav-section"><span class="nav-section-label">Finanzen</span></div>
      <div class="nav-item" data-key="documents" onclick="location.href='/client/documents.html'"><span class="nav-icon">&#128196;</span> Rechnungen &amp; Angebote</div>
      <div class="nav-section"><span class="nav-section-label">Konto</span></div>
      <div class="nav-item" data-key="settings" onclick="location.href='/client/settings.html'"><span class="nav-icon">&#9881;</span> Einstellungen</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebarAvatar">K</div><div><div class="user-name" id="sidebarUserName">Kunde</div><div class="user-role">Kundenportal</div></div></div>
      <button class="btn-logout" id="btnLogout">Abmelden</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Meine Kampagne</h1>
      <span class="text-muted text-sm" id="lastUpdated"></span>
    </div>
    <div class="page-body" id="campaignContent">
      <div class="loading-overlay">Laden...</div>
    </div>
  </main>
</div>

<div id="toast" style="display:none;position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:9999;"></div>

<script src="/js/api.js"></script>
<script>
  requireAuth('client');
  initNav('campaigns');

  document.getElementById('lastUpdated').textContent = 'Stand: ' + new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });

  const statusConfig = {
    active: { label: 'Aktiv – Werbung läuft', icon: '🟢', pillCls: 'pill-active', heroBg: 'linear-gradient(135deg,#4f46e5 0%,#6366f1 100%)', message: 'Ihre Werbung ist aktiv. Wir generieren aktuell neue Anfragen für Ihr Unternehmen.', detail: 'Neue Leads werden automatisch in Ihre Liste eingetragen und Sie werden informiert.' },
    paused: { label: 'Kampagne pausiert', icon: '🟡', pillCls: 'pill-paused', heroBg: 'linear-gradient(135deg,#d97706 0%,#f59e0b 100%)', message: 'Ihre Werbung ist momentan pausiert.', detail: 'Mögliche Gründe: Budgetanpassung, Optimierung oder saisonale Pause. Bei Fragen sprechen Sie uns an.' },
    ended: { label: 'Kampagne beendet', icon: '⚪', pillCls: 'pill-paused', heroBg: 'linear-gradient(135deg,#6b7280 0%,#9ca3af 100%)', message: 'Diese Kampagne wurde abgeschlossen.', detail: 'Die generierten Leads sind weiterhin in Ihrer Liste sichtbar. Sprechen Sie uns für eine neue Kampagne an.' },
  };

  async function loadCampaigns() {
    const container = document.getElementById('campaignContent');
    try {
      const campaigns = await API.get('/api/client/campaigns');

      if (!campaigns.length) {
        container.innerHTML = `
          <div class="no-camp-state">
            <div class="no-camp-icon">📊</div>
            <h3 style="font-size:18px;font-weight:700;margin-bottom:8px">Noch keine Kampagne eingerichtet</h3>
            <p style="color:#6b7280;font-size:14px">Es wurde noch keine Kampagne für Ihr Konto angelegt.<br>Bitte sprechen Sie uns an – wir starten sofort.</p>
          </div>`;
        return;
      }

      container.innerHTML = campaigns.map(c => renderCampaign(c)).join('');

    } catch(e) {
      container.innerHTML = `
        <div style="padding:40px;text-align:center;color:#6b7280">
          <div style="font-size:32px;margin-bottom:12px">⚠️</div>
          <div style="font-weight:600;margin-bottom:6px">Kampagnen konnten nicht geladen werden</div>
          <div style="font-size:13px">${e.message || 'Bitte Seite neu laden oder Support kontaktieren.'}</div>
          <button class="btn btn-secondary" style="margin-top:16px" onclick="location.reload()">Neu laden</button>
        </div>`;
    }
  }

  function renderCampaign(c) {
    const cfg = statusConfig[c.status] || statusConfig.active;
    const successRate = c.lead_count > 0 ? Math.round((c.closed_leads / c.lead_count) * 100) : 0;
    const publishedFunnels = (c.funnels || []).filter(f => f.status === 'published' && f.slug);
    const draftFunnels = (c.funnels || []).filter(f => f.status !== 'published');

    // Geo info from JSON blob if available
    let geoInfo = null;
    try { if (c.geo_targeting && c.geo_targeting !== '{}') geoInfo = JSON.parse(c.geo_targeting); } catch {}
    const geoText = geoInfo?.city ? `${geoInfo.city} (${geoInfo.radius_km || 25} km Umkreis)` : (c.geo_location_name || null);

    return `
      <div style="max-width:700px;margin-bottom:32px">

        <!-- Hero status bar -->
        <div class="camp-hero" style="background:${cfg.heroBg}">
          <div class="camp-status-pill ${cfg.pillCls}">${cfg.icon} ${cfg.label}</div>
          <div class="camp-hero-title">${c.name}</div>
          <div class="camp-hero-sub">${cfg.message}</div>
          ${cfg.detail ? `<div style="font-size:12px;opacity:.7;margin-top:8px">${cfg.detail}</div>` : ''}
        </div>

        <!-- Info row: platform, geo, dates -->
        <div class="info-row">
          ${c.platform ? `<span>📱 <strong>${c.platform}</strong></span>` : ''}
          ${geoText ? `<span>📍 ${geoText}</span>` : ''}
          ${c.target_audience ? `<span>👥 ${c.target_audience}</span>` : ''}
          ${c.start_date ? `<span>📅 Start: <strong>${formatDate(c.start_date)}</strong></span>` : ''}
          ${c.end_date ? `<span>🏁 Ende: <strong>${formatDate(c.end_date)}</strong></span>` : ''}
        </div>

        <!-- Stats grid -->
        <div class="camp-detail-grid">
          <div class="camp-detail-item">
            <div class="camp-detail-label">Anfragen gesamt</div>
            <div class="camp-detail-value">${c.lead_count}</div>
            <div class="camp-detail-sub">Alle Anfragen seit Kampagnenstart</div>
          </div>
          <div class="camp-detail-item">
            <div class="camp-detail-label">Erfolgreich abgeschlossen</div>
            <div class="camp-detail-value" style="color:var(--success)">${c.closed_leads}</div>
            <div class="camp-detail-sub">Von Ihnen markiert</div>
          </div>
        </div>

        ${c.lead_count > 0 ? `
          <div class="card" style="padding:16px 20px;margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <span style="font-size:13px;font-weight:600;color:#374151">Ihre Abschluss-Quote</span>
              <span style="font-size:18px;font-weight:800;color:var(--success)">${successRate}%</span>
            </div>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${successRate}%"></div></div>
            <div style="font-size:12px;color:#9ca3af;margin-top:4px">${c.closed_leads} von ${c.lead_count} Anfragen abgeschlossen</div>
          </div>
        ` : ''}

        <!-- Landing Pages -->
        <div class="camp-section-title">🌐 Ihre Landing Pages</div>
        ${(c.funnels && c.funnels.length) ? `
          ${c.funnels.map(f => `
            <div class="landing-page-card">
              <div style="display:flex;align-items:center;gap:10px">
                <div class="lp-dot ${f.status === 'published' ? 'lp-dot-live' : 'lp-dot-draft'}"></div>
                <div>
                  <div style="font-weight:600;font-size:14px">${f.name}</div>
                  <div style="font-size:12px;color:#6b7280;margin-top:2px">
                    ${f.status === 'published' ? '✅ Live – erreichbar für Besucher' : '⚪ Entwurf – noch nicht veröffentlicht'}
                    ${f.published_at ? ' · seit ' + formatDate(f.published_at) : ''}
                  </div>
                </div>
              </div>
              ${f.status === 'published' && f.slug
                ? `<a href="/f/${f.slug}/" target="_blank" class="btn btn-primary btn-sm">🔗 Seite öffnen</a>`
                : `<span style="font-size:12px;color:#9ca3af">In Vorbereitung</span>`}
            </div>
          `).join('')}
        ` : `
          <div style="padding:20px;background:#f9fafb;border-radius:8px;font-size:13px;color:#6b7280;text-align:center">
            Noch keine Landing Page eingerichtet. Wir erstellen diese in Kürze für Sie.
          </div>
        `}

      </div>
    `;
  }

  loadCampaigns();
</script>
</body>
</html>
