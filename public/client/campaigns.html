<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Portal – Kampagnen</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-dot">&#9741;</div>Mein Portal<span class="sidebar-badge client">Kunde</span></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section"><span class="nav-section-label">Übersicht</span></div>
      <div class="nav-item" data-key="dashboard" onclick="window.location.href='/client/'"><span class="nav-icon">&#9732;</span> Dashboard</div>
      <div class="nav-section"><span class="nav-section-label">Meine Daten</span></div>
      <div class="nav-item" data-key="leads" onclick="window.location.href='/client/leads.html'"><span class="nav-icon">&#127919;</span> Leads</div>
      <div class="nav-item active" data-key="campaigns" onclick="window.location.href='/client/campaigns.html'"><span class="nav-icon">&#128202;</span> Kampagnen</div>
      <div class="nav-item" data-key="documents" onclick="window.location.href='/client/documents.html'"><span class="nav-icon">&#128196;</span> Dokumente</div>
      <div class="nav-section"><span class="nav-section-label">Konto</span></div>
      <div class="nav-item" data-key="settings" onclick="window.location.href='/client/settings.html'"><span class="nav-icon">&#9881;</span> Einstellungen</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebarAvatar">K</div><div><div class="user-name" id="sidebarUserName">Kunde</div><div class="user-role">Kundenportal</div></div></div>
      <button class="btn-logout" id="btnLogout">Abmelden</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Meine Kampagnen</h1>
    </div>
    <div class="page-body" id="campaignsContent">
      <div class="loading-overlay">Laden...</div>
    </div>
  </main>
</div>

<div id="toast" style="display:none;position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:9999;"></div>
<style>.toast-success{background:#16a34a}.toast-error{background:#dc2626}</style>

<script src="/js/api.js"></script>
<script>
  requireAuth('client');
  initNav('campaigns');

  async function loadCampaigns() {
    try {
      const campaigns = await API.get('/api/client/campaigns');
      const container = document.getElementById('campaignsContent');

      if (!campaigns.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">&#128202;</div><h3>Keine Kampagnen</h3><p>Es sind noch keine Kampagnen für Ihr Konto hinterlegt.</p></div>`;
        return;
      }

      container.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px">
        ${campaigns.map(c => `
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">${c.name}</div>
                ${c.platform ? `<div class="text-sm text-muted">${c.platform}</div>` : ''}
              </div>
              ${statusBadge(c.status)}
            </div>
            <div class="card-body">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
                <div class="stat-card" style="padding:14px">
                  <div class="stat-label">Leads gesamt</div>
                  <div class="stat-value" style="font-size:24px">${c.lead_count}</div>
                </div>
                <div class="stat-card" style="padding:14px">
                  <div class="stat-label">Abgeschlossen</div>
                  <div class="stat-value" style="font-size:24px;color:var(--success)">${c.closed_leads}</div>
                </div>
                <div class="stat-card" style="padding:14px">
                  <div class="stat-label">Monatsbudget</div>
                  <div style="font-size:18px;font-weight:700;margin-top:4px">${formatCurrency(c.budget_monthly)}</div>
                </div>
                <div class="stat-card" style="padding:14px">
                  <div class="stat-label">Kosten / Lead</div>
                  <div style="font-size:18px;font-weight:700;margin-top:4px">${c.cost_per_lead ? formatCurrency(c.cost_per_lead) : '—'}</div>
                </div>
              </div>

              ${c.start_date || c.end_date ? `
                <div style="display:flex;gap:16px;font-size:13px;color:var(--gray-600)">
                  ${c.start_date ? `<span>Start: ${formatDate(c.start_date)}</span>` : ''}
                  ${c.end_date ? `<span>Ende: ${formatDate(c.end_date)}</span>` : ''}
                </div>
              ` : ''}

              ${c.description ? `<p style="margin-top:12px;font-size:13px;color:var(--gray-600)">${c.description}</p>` : ''}

              <!-- Progress bar: closed / total -->
              ${c.lead_count > 0 ? `
                <div style="margin-top:16px">
                  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--gray-500);margin-bottom:4px">
                    <span>Erfolgsrate</span>
                    <span>${Math.round(c.closed_leads/c.lead_count*100)}%</span>
                  </div>
                  <div style="height:8px;background:var(--gray-100);border-radius:4px;overflow:hidden">
                    <div style="height:100%;background:var(--success);border-radius:4px;width:${Math.round(c.closed_leads/c.lead_count*100)}%"></div>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `).join('')}
      </div>`;
    } catch(e) { showToast(e.message,'error'); }
  }

  loadCampaigns();
</script>
</body>
</html>
