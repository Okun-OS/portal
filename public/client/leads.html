<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Portal – Leads</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-dot">&#9741;</div>Mein Portal<span class="sidebar-badge client">Kunde</span></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section"><span class="nav-section-label">Übersicht</span></div>
      <div class="nav-item" data-key="dashboard" onclick="location.href='/client/'"><span class="nav-icon">&#9732;</span> Dashboard</div>
      <div class="nav-section"><span class="nav-section-label">Meine Anfragen</span></div>
      <div class="nav-item active" data-key="leads" onclick="location.href='/client/leads.html'"><span class="nav-icon">&#127919;</span> Meine Leads</div>
      <div class="nav-item" data-key="campaigns" onclick="location.href='/client/campaigns.html'"><span class="nav-icon">&#128202;</span> Meine Kampagne</div>
      <div class="nav-section"><span class="nav-section-label">Finanzen</span></div>
      <div class="nav-item" data-key="documents" onclick="location.href='/client/documents.html'"><span class="nav-icon">&#128196;</span> Rechnungen &amp; Angebote</div>
      <div class="nav-section"><span class="nav-section-label">Konto</span></div>
      <div class="nav-item" data-key="settings" onclick="location.href='/client/settings.html'"><span class="nav-icon">&#9881;</span> Einstellungen</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebarAvatar">K</div><div><div class="user-name" id="sidebarUserName">Kunde</div><div class="user-role">Kundenportal</div></div></div>
      <button class="btn-logout" id="btnLogout">Abmelden</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Meine Leads</h1>
    </div>
    <div class="page-body">
      <!-- Filters -->
      <div class="card mb-4">
        <div class="card-body" style="padding:14px 20px">
          <div class="search-bar">
            <div class="search-input-wrap">
              <span class="search-icon">&#128269;</span>
              <input type="text" id="searchInput" class="form-control" placeholder="Name, E-Mail, Telefon, Region...">
            </div>
            <select id="filterStatus" class="form-control" style="width:160px">
              <option value="">Alle Status</option>
              <option value="new">Neu</option>
              <option value="contacted">Kontaktiert</option>
              <option value="appointment">Termin</option>
              <option value="closed">Abgeschlossen</option>
            </select>
            <button class="btn btn-secondary" onclick="loadLeads()">Suchen</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div id="leadsTableWrap"><div class="loading-overlay">Laden...</div></div>
        <div id="pagination" class="pagination" style="padding:12px"></div>
      </div>
    </div>
  </main>
</div>

<!-- Lead Detail Modal -->
<div class="modal-overlay" id="modalDetail">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="detailTitle">Lead Details</span>
      <button class="modal-close" onclick="closeModal('modalDetail')">&times;</button>
    </div>
    <div class="modal-body" id="detailBody">Laden...</div>
  </div>
</div>

<!-- Email Modal -->
<div class="modal-overlay" id="modalEmail">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">E-Mail senden</span>
      <button class="modal-close" onclick="closeModal('modalEmail')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="emailLeadId">
      <div class="form-group">
        <label class="form-label">An</label>
        <input type="text" id="emailTo" class="form-control" disabled>
      </div>
      <div class="form-group">
        <label class="form-label">Betreff <span class="required">*</span></label>
        <input type="text" id="emailSubject" class="form-control" placeholder="Betreff der Nachricht">
      </div>
      <div class="form-group">
        <label class="form-label">Nachricht <span class="required">*</span></label>
        <textarea id="emailBody" class="form-control" rows="8" placeholder="Ihre Nachricht an den Lead..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalEmail')">Abbrechen</button>
      <button class="btn btn-primary" onclick="sendEmail()">&#128140; Senden</button>
    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:13px;z-index:9999;"></div>
<style>.toast-success{background:#16a34a}.toast-error{background:#dc2626}</style>

<script src="/js/api.js"></script>
<script>
  requireAuth('client');
  initNav('leads');

  let currentPage = 1;

  async function loadLeads(page = 1) {
    currentPage = page;
    const search = document.getElementById('searchInput').value;
    const status = document.getElementById('filterStatus').value;

    let url = `/api/client/leads?page=${page}`;
    if (search) url += '&search=' + encodeURIComponent(search);
    if (status) url += '&status=' + status;

    try {
      const data = await API.get(url);
      renderLeads(data);
    } catch(e) { showToast(e.message,'error'); }
  }

  function renderLeads(data) {
    if (!data.leads.length) {
      document.getElementById('leadsTableWrap').innerHTML = `<div class="empty-state"><div class="empty-state-icon">&#127919;</div><h3>Keine Leads gefunden</h3><p>Noch keine Leads vorhanden oder keine Treffer für Ihre Suche.</p></div>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    const rows = data.leads.map(l => `
      <tr>
        <td><strong style="cursor:pointer;color:var(--primary)" onclick="showDetail(${l.id})">${l.name}</strong></td>
        <td>${l.phone ? `<a href="tel:${l.phone}">${l.phone}</a>` : '—'}</td>
        <td>${l.email ? `<a href="mailto:${l.email}">${l.email}</a>` : '—'}</td>
        <td>${l.region || '—'}</td>
        <td>${formatDate(l.created_at)}</td>
        <td>${statusBadge(l.status)}</td>
        <td>
          <div class="table-actions">
            <select class="form-control" style="width:130px;padding:4px 8px;font-size:12px" onchange="updateStatus(${l.id},this.value)" title="Status ändern">
              <option value="new" ${l.status==='new'?'selected':''}>Neu</option>
              <option value="contacted" ${l.status==='contacted'?'selected':''}>Kontaktiert</option>
              <option value="appointment" ${l.status==='appointment'?'selected':''}>Termin</option>
              <option value="closed" ${l.status==='closed'?'selected':''}>Abgeschlossen</option>
            </select>
            <button class="btn btn-sm btn-secondary" onclick="showDetail(${l.id})">Details</button>
          </div>
        </td>
      </tr>
    `).join('');

    document.getElementById('leadsTableWrap').innerHTML = `
      <table>
        <thead><tr><th>Name</th><th>Telefon</th><th>E-Mail</th><th>Region</th><th>Datum</th><th>Status</th><th>Aktion</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    let pages = '';
    for (let i = 1; i <= data.pages; i++) {
      pages += `<button class="page-btn ${i===data.page?'active':''}" onclick="loadLeads(${i})">${i}</button>`;
    }
    document.getElementById('pagination').innerHTML = pages;
  }

  async function updateStatus(id, status) {
    try {
      await API.put('/api/client/leads/' + id + '/status', { status });
      showToast('Status aktualisiert');
      loadLeads(currentPage);
    } catch(e) { showToast(e.message,'error'); }
  }

  async function showDetail(id) {
    openModal('modalDetail');
    document.getElementById('detailBody').innerHTML = '<div class="loading-overlay">Laden...</div>';

    try {
      const l = await API.get('/api/client/leads/' + id);
      document.getElementById('detailTitle').textContent = l.name;

      document.getElementById('detailBody').innerHTML = `
        <div class="tabs mb-4">
          <div class="tab active" onclick="showTab('tabInfo','${id}')">Informationen</div>
          <div class="tab" onclick="showTab('tabNotes','${id}')">Notizen</div>
          <div class="tab" onclick="showTab('tabHistory','${id}')">Verlauf</div>
          ${l.email ? `<div class="tab" onclick="showTab('tabEmail','${id}')">E-Mail</div>` : ''}
        </div>

        <div id="tabInfo" class="tab-content active">
          <div class="detail-grid mb-4">
            <div class="detail-item"><label>Telefon</label><span>${l.phone ? `<a href="tel:${l.phone}">${l.phone}</a>` : '—'}</span></div>
            <div class="detail-item"><label>E-Mail</label><span>${l.email ? `<a href="mailto:${l.email}">${l.email}</a>` : '—'}</span></div>
            <div class="detail-item"><label>Region</label><span>${l.region || '—'}</span></div>
            <div class="detail-item"><label>Quelle</label><span>${l.source || '—'}</span></div>
            <div class="detail-item"><label>Status</label><span>${statusBadge(l.status)}</span></div>
            <div class="detail-item"><label>Kampagne</label><span>${l.campaign_name || '—'}</span></div>
            <div class="detail-item"><label>Erstellt am</label><span>${formatDateTime(l.created_at)}</span></div>
            <div class="detail-item"><label>Aktualisiert</label><span>${formatDateTime(l.updated_at)}</span></div>
          </div>

          <div class="form-group">
            <label class="form-label">Status ändern</label>
            <div style="display:flex;gap:8px">
              <select id="detailStatus" class="form-control">
                <option value="new" ${l.status==='new'?'selected':''}>Neu</option>
                <option value="contacted" ${l.status==='contacted'?'selected':''}>Kontaktiert</option>
                <option value="appointment" ${l.status==='appointment'?'selected':''}>Termin</option>
                <option value="closed" ${l.status==='closed'?'selected':''}>Abgeschlossen</option>
              </select>
              <button class="btn btn-primary" onclick="updateStatusDetail(${l.id})">Speichern</button>
            </div>
          </div>

          ${l.email ? `<div style="margin-top:12px"><button class="btn btn-secondary" onclick="openEmail(${l.id},'${l.email}','${l.name}')">&#128140; E-Mail senden</button></div>` : ''}
        </div>

        <div id="tabNotes" class="tab-content">
          <div style="display:flex;gap:8px;margin-bottom:16px">
            <input type="text" id="noteInput${l.id}" class="form-control" placeholder="Neue Notiz hinzufügen...">
            <button class="btn btn-primary" onclick="addNote(${l.id})">Hinzufügen</button>
          </div>
          <div id="notesList">
            ${(l.notes || []).length
              ? l.notes.map(n => `<div class="card" style="padding:12px;margin-bottom:8px"><div style="font-size:13px">${n.content}</div><div class="text-sm text-muted" style="margin-top:4px">${formatDateTime(n.created_at)} · ${n.author}</div></div>`).join('')
              : '<p class="text-muted text-sm">Keine Notizen vorhanden.</p>'
            }
          </div>
        </div>

        <div id="tabHistory" class="tab-content">
          <div class="timeline">
            ${(l.history || []).map(h => `
              <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                  <div class="timeline-text">${h.field}: <em>${h.old_value || 'neu'}</em> → <strong>${h.new_value}</strong></div>
                  <div class="timeline-time">${formatDateTime(h.created_at)} · ${h.changed_by}</div>
                </div>
              </div>
            `).join('') || '<p class="text-muted text-sm">Kein Verlauf vorhanden.</p>'}
          </div>
        </div>

        ${l.email ? `
        <div id="tabEmail" class="tab-content">
          <div style="margin-bottom:16px">
            <button class="btn btn-primary" onclick="openEmail(${l.id},'${l.email}','${l.name}')">&#43; Neue E-Mail schreiben</button>
          </div>
          <div>
            ${(l.emails || []).length
              ? l.emails.map(e => `
                  <div class="card" style="padding:12px;margin-bottom:8px">
                    <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                      <strong>${e.subject}</strong>
                      <span class="text-sm text-muted">${formatDateTime(e.sent_at)}</span>
                    </div>
                    <div class="text-sm" style="white-space:pre-wrap;color:var(--gray-700)">${e.body}</div>
                    <div class="text-sm text-muted" style="margin-top:6px">An: ${e.to_email}</div>
                  </div>
                `).join('')
              : '<p class="text-muted text-sm">Noch keine E-Mails gesendet.</p>'
            }
          </div>
        </div>
        ` : ''}
      `;
    } catch(e) { showToast(e.message,'error'); }
  }

  function showTab(id, leadId) {
    document.querySelectorAll('#detailBody .tab').forEach((t, i) => {
      const tabs = ['tabInfo','tabNotes','tabHistory','tabEmail'];
      t.classList.toggle('active', tabs[i] === id);
    });
    document.querySelectorAll('#detailBody .tab-content').forEach(c => {
      c.classList.toggle('active', c.id === id);
    });
  }

  async function updateStatusDetail(id) {
    const status = document.getElementById('detailStatus').value;
    try {
      await API.put('/api/client/leads/' + id + '/status', { status });
      showToast('Status aktualisiert');
      loadLeads(currentPage);
      closeModal('modalDetail');
    } catch(e) { showToast(e.message,'error'); }
  }

  async function addNote(leadId) {
    const input = document.getElementById('noteInput' + leadId);
    if (!input.value.trim()) return;
    try {
      await API.post('/api/client/leads/' + leadId + '/notes', { content: input.value });
      showToast('Notiz hinzugefügt');
      input.value = '';
      showDetail(leadId);
    } catch(e) { showToast(e.message,'error'); }
  }

  function openEmail(leadId, email, name) {
    document.getElementById('emailLeadId').value = leadId;
    document.getElementById('emailTo').value = name + ' <' + email + '>';
    document.getElementById('emailSubject').value = '';
    document.getElementById('emailBody').value = '';
    closeModal('modalDetail');
    openModal('modalEmail');
  }

  async function sendEmail() {
    const leadId = document.getElementById('emailLeadId').value;
    const subject = document.getElementById('emailSubject').value;
    const body = document.getElementById('emailBody').value;
    try {
      await API.post('/api/client/leads/' + leadId + '/email', { subject, body });
      closeModal('modalEmail');
      showToast('E-Mail gesendet und gespeichert');
    } catch(e) { showToast(e.message,'error'); }
  }

  // Check URL for direct lead ID
  const urlParams = new URLSearchParams(window.location.search);
  loadLeads().then(() => {
    if (urlParams.get('id')) showDetail(urlParams.get('id'));
  });

  document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadLeads(); });
</script>
</body>
</html>
