[build]
builder = "NIXPACKS"
buildCommand = "cd v2 && pnpm install --frozen-lockfile && pnpm db:push && pnpm build --filter @okun/web"

[deploy]
startCommand = "cd v2/apps/web && node .next/standalone/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
